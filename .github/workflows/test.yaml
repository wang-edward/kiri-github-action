name: Test Helpers

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n entrypoint.sh scripts/*.sh tests/*.sh
      - name: Test preview directories
        run: tests/preview-directories.sh
